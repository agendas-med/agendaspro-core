name: CI

on:
  push:
    branches: [main, dev, 'launch/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          # Banco descartável do job (não é segredo de produção).
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      NODE_ENV: test
      # Runner e banco em UTC (como dyno e add-on); a suíte também passa em -03:00.
      TZ: UTC
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_ROOT_PASSWORD: ci_root_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Banco e usuário de aplicação (sem root, como um add-on)
        run: |
          docker exec ${{ job.services.mariadb.id }} mariadb -uroot -pci_root_password -e "
            CREATE DATABASE agendaspro_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE USER 'agendaspro_app'@'%' IDENTIFIED BY 'ci_app_password';
            GRANT ALL PRIVILEGES ON agendaspro_ci.* TO 'agendaspro_app'@'%';"

      - name: Migrations (duas vezes, prova idempotência da release phase)
        env:
          MYSQL_DATABASE: agendaspro_ci
          MYSQL_USER: agendaspro_app
          MYSQL_PASSWORD: ci_app_password
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Suíte completa em série (unit + integração com MariaDB)
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee test-output.txt
          # Testes de integração pulam sem MYSQL_ROOT_PASSWORD: no CI, nenhum pode pular.
          grep -Eq '^(# |ℹ )skipped 0$' test-output.txt || { echo "Há testes pulados"; exit 1; }

      - name: npm audit (informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
